plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.release = 17 }

application { mainClass = 'io.aix.preprocessor.Main' }

dependencies {
    implementation 'org.apache.parquet:parquet-hadoop:1.15.2'
    implementation 'org.apache.hadoop:hadoop-client-api:3.4.3'
    runtimeOnly 'org.apache.hadoop:hadoop-client-runtime:3.4.3'
    runtimeOnly 'org.apache.parquet:parquet-jackson:1.15.2'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

// Keep the thin jar for Gradle's application distribution.
tasks.jar {
    destinationDirectory = layout.buildDirectory.dir('thin')
}

tasks.shadowJar {
    archiveClassifier = ''
    manifest { attributes 'Main-Class': application.mainClass.get() }
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    zip64 = true
}

tasks.assemble { dependsOn tasks.shadowJar }
