name: Git mirror cleanup

on:
  push:
    branches: [fix/windows-git-object-cleanup]
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/io/aix/preprocessor/Main.java'
      - 'src/main/java/io/aix/preprocessor/BlobReader.java'
      - 'src/test/java/io/aix/preprocessor/ExtractionTest.java'
      - '.github/workflows/git-mirror-cleanup.yml'

permissions:
  contents: read

jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run extraction and cleanup tests (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --console=plain test
      - name: Run extraction and cleanup tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain test
      - name: Verify cleanup regressions actually executed
        if: always()
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("build/test-results/test/TEST-io.aix.preprocessor.ExtractionTest.xml")
          cases = ElementTree.parse(report).getroot().findall("testcase")
          failed_tags = ("failure", "error", "skipped")
          passed = {c.attrib["name"] for c in cases if all(c.find(tag) is None for tag in failed_tags)}
          expected = {
              "extractsSideBranchesAndWritesIdenticalParallelOutput()",
              "deletesReadOnlyObjectFilesWrittenByGit()",
              "closingBlobReaderReleasesMirrorForImmediateDeletion()",
              "cleanupPreservesDirectoryLinkTarget()",
          }
          print("Passed:", sorted(passed))
          if expected - passed:
              raise SystemExit("Missing or unsuccessful: " + str(sorted(expected - passed)))
